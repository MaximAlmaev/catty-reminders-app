name: CD

on:
  release:
    types: [published]

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: checkout-code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: get-commit-hash
      run: |
        TAG=${{ github.event.release.tag_name }}
        HASH=$(git rev-list -n 1 $TAG)
        echo "RELEASE_HASH=$HASH" >> $GITHUB_ENV
        echo "Release hash: $HASH"

    - name: execute-remote-SSH-commands
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ vars.HOST }}
        username: ${{ vars.USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ vars.PORT }}
        script: |
          set -e

          echo "${{ secrets.TOKEN }}" | docker login ghcr.io -u MaximAlmaev --password-stdin

          docker pull ghcr.io/maximalmaev/catty-reminders-app:${{ env.RELEASE_HASH }}

          docker stop catty-reminders-app || true
          docker rm catty-reminders-app || true

          docker run -d --name catty-reminders-app -p 8181:8181 ghcr.io/maximalmaev/catty-reminders-app:${{ env.RELEASE_HASH }}
          sleep 4

          if docker ps | grep -q catty-reminders-app; then
              echo "Deployment completed successfully"
          else
              echo "ERROR: Application failed to start"
              exit 1
          fi
