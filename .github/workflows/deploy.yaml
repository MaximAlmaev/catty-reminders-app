name: CD

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      packages: read

    steps:
      - name: Prepare image name
        id: prep
        run: |
          echo "image=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.HOST }}
          username: ${{ vars.USER }}
          port: ${{ vars.POST }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -eu
            
            cd /home/maxim/Desktop/catty-reminders-app

            export COMPOSE_PROJECT_NAME=catty-reminders-app
            export IMAGE="${{ steps.prep.outputs.image }}:${{ github.sha }}"
            export MARIADB_ROOT_PASSWORD=mypass
            export MARIADB_DATABASE=catty_reminders
            export MARIADB_USER=user
            export MARIADB_PASSWORD=mypass
            
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker compose up -d --pull always --remove-orphans
