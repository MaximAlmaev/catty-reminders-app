name: CI

on:
  push:
    branches:
      - lab4
      - 'lab4_autotests*'
  pull_request:
    branches:
      - lab4
      - 'lab4_autotests*'
jobs:
  pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    services:
      db:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: mypass
          MYSQL_DATABASE: catty_reminders
          MYSQL_USER: user
          MYSQL_PASSWORD: mypass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uuser -pmypass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10


    steps:
    - name: checkout-code
      uses: actions/checkout@v7

    - name: Lint Dockerfile
      uses: hadolint/hadolint-action@v3.1.0
      continue-on-error: true
      with:
        dockerfile: Dockerfile
        failure-threshold: warning

    - name: setup-python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'

    - name: install-requirements
      run: |
        pip install -r requirements.txt
        playwright install --with-deps chromium

    - name: patch-config-for-ci
      run: |
        jq '.db_config.host = "127.0.0.1"' config.json > config.json.tmp
        mv config.json.tmp config.json

    - name: run-catty-app
      run: |
        uvicorn app.main:app --host 0.0.0.0 --port 8181 > uvicorn.log 2>&1 &
        sleep 5

    - name: start-tests
      env:
        PYTHONPATH: ${{ github.workspace }}
      run: python -m pytest tests/ --junitxml=test_result.xml

    - name: show-app-log
      if: always()
      run: cat uvicorn.log
      
    - name: save-artifact
      uses: actions/upload-artifact@v7
      with:
        name: test_result
        path: test_result.xml

    - name: tag-image
      id: meta
      uses: docker/metadata-action@v4
      with:
        images: ghcr.io/maximalmaev/catty-reminders-app
        tags: |
          type=raw,value=${{ github.sha }}
          type=raw,value=latest

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: create-image
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        build-args: DEPLOY_REF=${{ github.sha }}
